<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <rect width="800" height="200" fill="#0d1117"/>

  <!-- React atom icon (left) -->
  <g transform="translate(200,100)">
    <!-- Ellipses -->
    <ellipse cx="0" cy="0" rx="70" ry="27" fill="none" stroke="#61DAFB" stroke-width="5"/>
    <ellipse cx="0" cy="0" rx="70" ry="27" fill="none" stroke="#61DAFB" stroke-width="5" transform="rotate(60)"/>
    <ellipse cx="0" cy="0" rx="70" ry="27" fill="none" stroke="#61DAFB" stroke-width="5" transform="rotate(120)"/>
    <!-- Center dot -->
    <circle cx="0" cy="0" r="9" fill="#61DAFB"/>
  </g>
  <text x="200" y="165" text-anchor="middle" font-family="monospace" font-size="18" fill="#61DAFB" letter-spacing="2">React</text>

  <!-- Divider -->
  <line x1="400" y1="30" x2="400" y2="170" stroke="#333" stroke-width="1"/>

  <!-- Spring Boot leaf (right) -->
  <g transform="translate(600,90)">
    <path d="M0,-55 C40,-55 65,-30 65,5 C65,50 30,65 0,65 C-30,65 -65,50 -65,5 C-65,-30 -40,-55 0,-55 Z" fill="#6DB33F" opacity="0.18"/>
    <path d="M0,-45 C30,-45 52,-22 52,5 C52,38 25,52 0,52 C-25,52 -52,38 -52,5 C-52,-22 -30,-45 0,-45 Z" fill="none" stroke="#6DB33F" stroke-width="4"/>
    <!-- Leaf veins -->
    <line x1="0" y1="-40" x2="0" y2="48" stroke="#6DB33F" stroke-width="3"/>
    <line x1="-25" y1="-10" x2="25" y2="-10" stroke="#6DB33F" stroke-width="2" opacity="0.7"/>
    <line x1="-35" y1="15" x2="35" y2="15" stroke="#6DB33F" stroke-width="2" opacity="0.5"/>
  </g>
  <text x="600" y="165" text-anchor="middle" font-family="monospace" font-size="18" fill="#6DB33F" letter-spacing="2">Spring Boot</text>
</svg>
